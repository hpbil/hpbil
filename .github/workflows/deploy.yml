name: Security Scan & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant GITHUB_TOKEN the necessary permissions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  security-scan:
    name: 🛡️ Fast Security Scan (Katana & Nuclei)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast Install Katana & Nuclei (Pre-built Binaries)
        run: |
          echo "⚡ Fast-downloading pre-compiled binaries from ProjectDiscovery releases..."
          mkdir -p $HOME/.local/bin
          
          # Download pre-built Katana binary
          KATANA_URL=$(curl -s https://api.github.com/repos/projectdiscovery/katana/releases/latest | grep -o "https://[^\"]*katana_[^\"]*_linux_amd64.zip" | head -n 1)
          wget -q $KATANA_URL -O katana.zip
          unzip -q -o katana.zip -d $HOME/.local/bin/
          rm katana.zip
          
          # Download pre-built Nuclei binary
          NUCLEI_URL=$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | grep -o "https://[^\"]*nuclei_[^\"]*_linux_amd64.zip" | head -n 1)
          wget -q $NUCLEI_URL -O nuclei.zip
          unzip -q -o nuclei.zip -d $HOME/.local/bin/
          rm nuclei.zip
          
          chmod +x $HOME/.local/bin/katana $HOME/.local/bin/nuclei
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Start Local Test Server
        run: |
          echo "Starting Python HTTP Server on port 8080..."
          python3 -m http.server 8080 &
          sleep 2

      - name: Run Katana Crawler
        run: |
          echo "Running Katana crawler against localhost:8080..."
          katana -u http://localhost:8080 -o katana_results.txt || true

      - name: Run Nuclei Scanner
        run: |
          echo "Running Nuclei scanner against localhost:8080..."
          nuclei -u http://localhost:8080 -o nuclei_results.txt -severity info,low,medium,high,critical || true

      - name: Write Summary to GitHub Actions Log
        run: |
          echo "## 🔍 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "### 🕷️ Katana Crawled Endpoints" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -s katana_results.txt ]; then
            cat katana_results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No endpoints discovered or empty result." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "### 🛡️ Nuclei Scan Findings" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -s nuclei_results.txt ]; then
            cat nuclei_results.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No vulnerabilities or misconfigurations detected." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Scan Results as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            katana_results.txt
            nuclei_results.txt

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: security-scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
